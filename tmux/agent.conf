# Agents and sessions: off-the-shelf tools, plus notifications.
#
#   sesh       one session per project (sesh/sesh.toml)
#   worktrunk  worktrees, shown as windows by its hooks (worktrunk/config.toml)
#   workmux    agent status from its harness hooks, sidebar and dashboard
#              across all sessions; its worktree commands are not used
#
# The only custom piece is tmux/bin/agent-notify: native macOS notifications
# when a workmux agent needs you or finishes, clicking through to its pane.

# Notification watcher, one per server (it holds a lock and exits with tmux).
# Silent and always successful: run-shell shows a job's output or failure
# (including being stopped on restart) over the current pane.
run-shell -b '"$XDG_CONFIG_HOME/tmux/bin/agent-notify" >/dev/null 2>&1; true'

################################################################################
# Option layer (root table, no prefix): everything above the pane, on left
# Option sent as Meta. Prefix bindings are untouched.

# Sessions and projects.
bind-key -n M-w display-popup -E -w 80% -h 75% -T ' sesh ' 'sesh picker --icons --hide-duplicates --preview'

# Agents in every session: sidebar (toggle), dashboard, latest needing you.
bind-key -n M-s run-shell -b 'workmux sidebar'
bind-key -n M-d display-popup -E -w 90% -h 80% 'workmux dashboard'
bind-key -n M-a run-shell -b 'workmux last-done'

# Back to the previous session.
bind-key -n M-o switch-client -l
