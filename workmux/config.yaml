nerdfont: true

# Worktrees live under ~/.worktrees/<project>, matching the git-tree skill and
# the ~/.worktrees entry already allowlisted in .claude/settings.json.
worktree_dir: ~/.worktrees/{project}

# Explicit rather than inherited: the default is documented as "wm-" but an
# unset value produced session names with a leading space during the bake-off.
window_prefix: ""

# Agent launched by `workmux add`. Without a panes block, workmux opens plain
# shells and the agent must be started by hand -- which means it can land
# outside the pane, where the status hooks have no $TMUX_PANE to report into.
agent: claude

panes:
  - command: <agent>
    focus: true
  - split: horizontal
    size: 20
