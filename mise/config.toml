# Global mise config, symlinked in as ~/.config/mise/config.toml, so tool
# versions written here by `mise use -g` are tracked in git.
#
# mise owns SDKs whose version varies per project -- brew's copies of those are
# substrate for other formulae and can move whenever those formulae need them
# to, so they can't be pinned. Tools where latest is always fine belong to
# Homebrew instead, and Python is managed per-project by uv.

[tools]
go = "1.27.1"
node = "26.10.0"
npm = "12.1.0"
ruby = "4.0.7"
vault = "2.1.1"
