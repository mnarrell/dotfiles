# worktrunk -- git worktree lifecycle.
#
# worktrunk owns worktree creation, switching and teardown; herdr is the
# surface that displays them and notifies when their agents finish. The hooks
# below are the seam between the two. See docs/agent-workflow-migration.md.

# Worktrees live under a single global root, separated by project and branch.
# This matches the root already granted in claude/settings.json, so agents
# working inside a worktree need no additional permission.
#
#   ~/.worktrees/homelab/feat-dynamic-dns
#
# `sanitize` turns a slashed branch (feat/dynamic-dns) into a single path
# segment (feat-dynamic-dns) rather than nesting an extra directory.
worktree-path = "~/.worktrees/{{ repo }}/{{ branch | sanitize }}"

################################################################################
# Hooks
#
# Hook bodies live in worktrunk/hooks/ as standalone scripts rather than inline
# commands, so they can be run and debugged directly without going through
# `wt`. Every hook is best-effort and exits 0 -- `pre-*` hooks are BLOCKING and
# a nonzero exit aborts the operation, so a stopped herdr server must never be
# able to wedge `wt remove`.
#
# Template variables: {{ worktree_path }} {{ repo_path }} {{ repo }}
#                     {{ branch }} {{ base }} {{ commit }} {{ cwd }}
# Full context also arrives as JSON on stdin.

# Switched to an existing worktree -- focus its workspace, or open one if the
# workspace was closed. Without this, the integration only works on creation.
# Deliberately NOT extended with copy-ignored/direnv: an existing worktree
# already has its files, and re-copying on every switch risks clobbering
# local changes with stale content from the primary checkout.
post-switch = "~/.config/worktrunk/hooks/herdr-open.sh {{ worktree_path }} {{ repo_path }} {{ branch }}"

# About to delete the checkout -- close its workspace first so herdr is not
# left holding a dead path.
pre-remove = "~/.config/worktrunk/hooks/herdr-close.sh {{ worktree_path }}"
skip-commit-generation-prompt = true

# post-start runs as a sequential pipeline (`[[post-start]]`, not a table) so
# that a new worktree gets its gitignored files (including .envrc) copied from
# the primary checkout, then has that .envrc trusted by direnv, before herdr
# opens a workspace for it. post-start is backgrounded and logged (`wt config
# state logs`), so a failure partway through cannot wedge `wt` itself -- it
# just means a later step (e.g. herdr-open) does not run for that worktree.
#
# NOTE: these three [[post-start]] blocks, and the [step.copy-ignored] table
# above them, must stay at the very end of the file (just before the
# deliberately-commented-out section and the [projects...] tables, which are
# themselves pinned to the end for the same reason). TOML assigns any bare
# key following a table header to that table, so scalar keys like
# `post-switch` above must come before, not after, an array-of-tables.

[step.copy-ignored]
# Only exclude path-keyed or trivially-rebuilt caches. Everything else
# (node_modules/, target/, vendor/, etc.) is cheap to copy because worktrunk
# reflinks on APFS (copy-on-write, no extra disk).
exclude = [".direnv/", ".venv/", "__pycache__/", ".pytest_cache/", ".mypy_cache/", ".ruff_cache/", ".terraform/"]

[[post-start]]
copy = "wt step copy-ignored"

[[post-start]]
# `direnv allow` exits 1 when there is no .envrc, which would abort this
# pipeline. direnv-allow.sh always exits 0 so repos without .envrc are a no-op.
direnv = "~/.config/worktrunk/hooks/direnv-allow.sh {{ worktree_path }}"

[[post-start]]
herdr = "~/.config/worktrunk/hooks/herdr-open.sh {{ worktree_path }} {{ repo_path }} {{ branch }}"

################################################################################
# Available but deliberately unwired. Uncomment to enable.
#
# post-merge is the known gap: `wt merge` tears the worktree down without
# closing its herdr workspace. Enable it if merging becomes the habitual
# teardown path rather than `wt remove`.
#
# post-merge  = "~/.config/worktrunk/hooks/herdr-close.sh {{ worktree_path }}"
# pre-merge   =
# pre-start   =
# pre-switch  =
# pre-commit  =
# post-commit =
# post-remove =

################################################################################
# Per-project overrides.
#
# `{{ repo }}` is the checkout's directory name, so a dotted repo lands in a
# hidden directory -- ~/.worktrees/.dotfiles/ rather than ~/.worktrees/dotfiles/.
# There is no filter that strips a leading dot (`sanitize` keeps it,
# `sanitize_db` mangles it to `_dotfiles_yes`), and no template variable exposes
# the remote-derived identifier, which is already dot-free. So the two dotted
# repos are pinned explicitly.
#
# Keys are worktrunk project identifiers, not paths. Find one with:
#
#   wt config show | grep Identifier
#
# These tables must stay at the end of the file: the hooks above are bare
# top-level keys, and TOML assigns any bare key to the most recent table header.

[projects."github.com/mnarrell/dotfiles"]
worktree-path = "~/.worktrees/dotfiles/{{ branch | sanitize }}"

[projects."github.com/mnarrell/private_dotfiles"]
worktree-path = "~/.worktrees/private_dotfiles/{{ branch | sanitize }}"
